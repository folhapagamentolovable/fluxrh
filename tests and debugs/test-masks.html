<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Máscaras - FluxPay</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-group { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 3px; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Teste de Máscaras - FluxPay</h1>
    
    <div class="test-group">
        <h3>Teste CNPJ</h3>
        <input type="text" id="cnpj" placeholder="Digite o CNPJ" maxlength="18">
        <div class="result" id="cnpj-result">Resultado aparecerá aqui</div>
    </div>
    
    <div class="test-group">
        <h3>Teste Telefone</h3>
        <input type="text" id="phone" placeholder="Digite o telefone" maxlength="15">
        <div class="result" id="phone-result">Resultado aparecerá aqui</div>
    </div>
    
    <div class="test-group">
        <h3>Teste CPF</h3>
        <input type="text" id="cpf" placeholder="Digite o CPF" maxlength="14">
        <div class="result" id="cpf-result">Resultado aparecerá aqui</div>
    </div>

    <script>
        // Funções de máscara (copiadas do utils/masks.ts)
        const phoneMask = (value) => {
            if (!value) return '';
            
            const numbers = value.replace(/\D/g, '');
            const limitedNumbers = numbers.substring(0, 11);
            
            if (limitedNumbers.length <= 2) {
                return limitedNumbers;
            } else if (limitedNumbers.length <= 6) {
                return limitedNumbers.replace(/(\d{2})(\d+)/, '($1) $2');
            } else if (limitedNumbers.length <= 10) {
                return limitedNumbers.replace(/(\d{2})(\d{4})(\d+)/, '($1) $2-$3');
            } else {
                return limitedNumbers.replace(/(\d{2})(\d{5})(\d+)/, '($1) $2-$3');
            }
        };

        const cnpjMask = (value) => {
            if (!value) return '';
            
            const numbers = value.replace(/\D/g, '');
            const limitedNumbers = numbers.substring(0, 14);
            
            if (limitedNumbers.length <= 2) {
                return limitedNumbers;
            } else if (limitedNumbers.length <= 5) {
                return limitedNumbers.replace(/(\d{2})(\d+)/, '$1.$2');
            } else if (limitedNumbers.length <= 8) {
                return limitedNumbers.replace(/(\d{2})(\d{3})(\d+)/, '$1.$2.$3');
            } else if (limitedNumbers.length <= 12) {
                return limitedNumbers.replace(/(\d{2})(\d{3})(\d{3})(\d+)/, '$1.$2.$3/$4');
            } else {
                return limitedNumbers.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d+)/, '$1.$2.$3/$4-$5');
            }
        };

        const cpfMask = (value) => {
            if (!value) return '';
            
            const numbers = value.replace(/\D/g, '');
            const limitedNumbers = numbers.substring(0, 11);
            
            if (limitedNumbers.length <= 3) {
                return limitedNumbers;
            } else if (limitedNumbers.length <= 6) {
                return limitedNumbers.replace(/(\d{3})(\d+)/, '$1.$2');
            } else if (limitedNumbers.length <= 9) {
                return limitedNumbers.replace(/(\d{3})(\d{3})(\d+)/, '$1.$2.$3');
            } else {
                return limitedNumbers.replace(/(\d{3})(\d{3})(\d{3})(\d+)/, '$1.$2.$3-$4');
            }
        };

        const removeMask = (value) => {
            return value.replace(/\D/g, '');
        };

        // Aplicar máscaras aos inputs
        document.getElementById('cnpj').addEventListener('input', function(e) {
            const masked = cnpjMask(e.target.value);
            e.target.value = masked;
            document.getElementById('cnpj-result').innerHTML = 
                `Formatado: ${masked}<br>Sem máscara: ${removeMask(masked)}`;
        });

        document.getElementById('phone').addEventListener('input', function(e) {
            const masked = phoneMask(e.target.value);
            e.target.value = masked;
            document.getElementById('phone-result').innerHTML = 
                `Formatado: ${masked}<br>Sem máscara: ${removeMask(masked)}`;
        });

        document.getElementById('cpf').addEventListener('input', function(e) {
            const masked = cpfMask(e.target.value);
            e.target.value = masked;
            document.getElementById('cpf-result').innerHTML = 
                `Formatado: ${masked}<br>Sem máscara: ${removeMask(masked)}`;
        });
    </script>
</body>
</html>
