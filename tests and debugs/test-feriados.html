<!DOCTYPE html>
<html>
<head>
    <title>Teste Feriados</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Teste de Feriados</h1>
    <div id="result"></div>
    
    <script>
        // Substitua com suas credenciais
        const SUPABASE_URL = 'SUA_URL_AQUI';
        const SUPABASE_KEY = 'SUA_KEY_AQUI';
        
        const { createClient } = supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_KEY);
        
        async function testarFeriados() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Carregando...</p>';
            
            try {
                const { data, error } = await client
                    .from('feriados')
                    .select('*');
                
                if (error) {
                    result.innerHTML = `<p style="color: red;">Erro: ${error.message}</p>`;
                    console.error('Erro:', error);
                    return;
                }
                
                result.innerHTML = `
                    <h2>Feriados encontrados: ${data.length}</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                console.log('Feriados:', data);
                
            } catch (err) {
                result.innerHTML = `<p style="color: red;">Erro: ${err.message}</p>`;
                console.error('Erro:', err);
            }
        }
        
        testarFeriados();
    </script>
</body>
</html>
